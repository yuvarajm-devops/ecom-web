name: E-commerce CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CI - Build images
      - name: Build Auth image
        run: docker build -t ecom-auth ./auth-service

      - name: Build Order image
        run: docker build -t ecom-order ./order-service

      - name: Build Product image
        run: docker build -t ecom-product ./product-service

      # CD - Replace containers
      - name: Deploy Auth
        run: |
          docker rm -f ecom-auth 2>/dev/null || true
          docker run -d \
            --name ecom-auth \
            -p 3001:3001 \
            ecom-auth

      - name: Deploy Order
        run: |
          docker rm -f ecom-order 2>/dev/null || true
          docker run -d \
            --name ecom-order \
            -p 3002:3002 \
            ecom-order

      - name: Deploy Product
        run: |
          docker rm -f ecom-products 2>/dev/null || true
          docker run -d \
            --name ecom-products \
            -p 3003:3003 \
            ecom-product

      # Verify
      - name: Verify deployment
        run: docker ps
