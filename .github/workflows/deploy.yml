name: Ecommerce Microservices CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout code
        uses: actions/checkout@v4


      # =========================
      # CI - INSTALL DEPENDENCIES
      # =========================

      - name: Install Auth dependencies
        run: |
          set -e
          cd auth-service
          npm install

      - name: Install Order dependencies
        run: |
          set -e
          cd order-service
          npm install

      - name: Install Product dependencies
        run: |
          set -e
          cd product-service
          npm install


      # =========================
      # CI - JAVASCRIPT TEST
      # =========================

      - name: Test Auth service
        run: |
          set -e
          node --check auth-service/index.js

      - name: Test Order service
        run: |
          set -e
          node --check order-service/index.js

      - name: Test Product service
        run: |
          set -e
          node --check product-service/index.js


      # =========================
      # CHECK DOCKER + BUILDX
      # =========================

      - name: Check Docker
        run: |
          set -e
          docker --version
          docker buildx version
          docker ps


      # =========================
      # CI - BUILD DOCKER IMAGES
      # =========================

      - name: Build Auth Docker image
        run: |
          set -e
          docker buildx build \
            -t ecom-auth \
            ./auth-service \
            --load

      - name: Build Order Docker image
        run: |
          set -e
          docker buildx build \
            -t ecom-order \
            ./order-service \
            --load

      - name: Build Product Docker image
        run: |
          set -e
          docker buildx build \
            -t ecom-product \
            ./product-service \
            --load


      # =========================
      # SHOW IMAGES
      # =========================

      - name: Check Docker images
        run: |
          set -e
          docker images


      # =========================
      # CD - REMOVE OLD CONTAINERS
      # =========================

      - name: Remove old containers
        run: |
          docker rm -f ecom-auth ecom-order ecom-product || true


      # =========================
      # CD - DEPLOY AUTH
      # =========================

      - name: Deploy Auth container
        run: |
          set -e

          docker run -d \
            --name ecom-auth \
            --network ecommerce-network \
            -p 3001:3001 \
            ecom-auth


      # =========================
      # CD - DEPLOY ORDER
      # =========================

      - name: Deploy Order container
        run: |
          set -e

          docker run -d \
            --name ecom-order \
            --network ecommerce-network \
            -p 3002:3002 \
            ecom-order


      # =========================
      # CD - DEPLOY PRODUCT
      # =========================

      - name: Deploy Product container
        run: |
          set -e

          docker run -d \
            --name ecom-product \
            --network ecommerce-network \
            -p 3003:3003 \
            ecom-product


      # =========================
      # WAIT FOR APPLICATIONS
      # =========================

      - name: Wait for containers
        run: |
          set -e
          sleep 5


      # =========================
      # TEST CONTAINERS
      # =========================

      - name: Test containers are running
        run: |
          set -e

          echo "Checking running containers..."

          docker ps

          echo "Checking Auth container..."
          docker inspect -f '{{.State.Running}}' ecom-auth | grep true

          echo "Checking Order container..."
          docker inspect -f '{{.State.Running}}' ecom-order | grep true

          echo "Checking Product container..."
          docker inspect -f '{{.State.Running}}' ecom-product | grep true

          echo "All containers are running successfully."


      # =========================
      # TEST AUTH APPLICATION
      # =========================

      - name: Test Auth application
        run: |
          set -e

          echo "Testing Auth service..."
          curl -f http://localhost:3001

          echo
          echo "Auth service test passed."


      # =========================
      # TEST ORDER APPLICATION
      # =========================

      - name: Test Order application
        run: |
          set -e

          echo "Testing Order service..."
          curl -f http://localhost:3002

          echo
          echo "Order service test passed."


      # =========================
      # TEST PRODUCT APPLICATION
      # =========================

      - name: Test Product application
        run: |
          set -e

          echo "Testing Product service..."
          curl -f http://localhost:3003

          echo
          echo "Product service test passed."


      # =========================
      # SHOW LOGS
      # =========================

      - name: Show container logs
        run: |
          echo "========== AUTH LOGS =========="
          docker logs ecom-auth

          echo "========== ORDER LOGS =========="
          docker logs ecom-order

          echo "========== PRODUCT LOGS =========="
          docker logs ecom-product


      # =========================
      # FINAL STATUS
      # =========================

      - name: Deployment successful
        run: |
          echo "======================================"
          echo "Ecommerce Microservices Deployment"
          echo "======================================"
